<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>MIDI Tuner</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div>
          <p class="eyebrow">MIDI tools</p>
          <h1>MIDI Tuner</h1>
        </div>
        <button id="enable-midi" type="button">Enable MIDI &amp; Piano Audio</button>
      </header>

      <p id="status" class="status" role="status">MIDI is not enabled.</p>

      <section class="panel" aria-labelledby="devices-heading">
        <h2 id="devices-heading">Devices</h2>
        <div class="device-columns">
          <div>
            <h3>Inputs</h3>
            <ul id="input-devices" class="device-list">
              <li class="empty-state">No inputs found.</li>
            </ul>
          </div>
          <div>
            <h3>Outputs</h3>
            <ul id="output-devices" class="device-list">
              <li class="empty-state">No outputs found.</li>
            </ul>
          </div>
        </div>
      </section>

      <section class="panel piano-panel" aria-labelledby="piano-heading">
        <div class="panel-heading">
          <div>
            <h2 id="piano-heading">88-key piano</h2>
            <p class="piano-hint">
              Click a key to cycle tuning: normal, +50 cents (blue), or -50 cents (amber).
              A MIDI sustain pedal holds released notes until lifted.
            </p>
          </div>
          <div class="piano-indicators">
            <span
              id="sustain-indicator"
              class="sustain-indicator"
              role="status"
              aria-live="polite"
              aria-label="Sustain pedal off"
            >
              Sustain off
            </span>
            <span class="piano-range">A0–C8</span>
          </div>
        </div>
        <div class="piano-scroll">
          <div
            id="piano-keyboard"
            class="piano-keyboard"
            role="group"
            aria-label="88-key piano. No keys are currently active."
          ></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
